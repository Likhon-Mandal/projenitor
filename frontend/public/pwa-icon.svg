<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%" fx="45%" fy="30%">
      <stop offset="0%" stop-color="#b43a13" />
      <stop offset="45%" stop-color="#9a3412" />
      <stop offset="80%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>

    <!-- Golden Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="treeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#fef9c3" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1c0702" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Elegant Golden Halo / Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6" />
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.4" />

  <!-- Central Glow Sphere -->
  <circle cx="256" cy="225" r="140" fill="#facc15" opacity="0.08" filter="url(#glow)" />

  <!-- Heritage Tree Emblem (Projenitor Ancestral Tree) -->
  <g filter="url(#dropShadow)">
    <!-- Tree Trunk & Roots -->
    <path d="M 256 320 
             C 252 285 242 260 225 240
             C 215 228 198 220 185 210
             C 180 206 182 198 188 200
             C 205 206 220 220 235 235
             C 246 246 252 265 254 285
             L 258 285
             C 260 265 266 246 277 235
             C 292 220 307 206 324 200
             C 330 198 332 206 327 210
             C 314 220 297 228 287 240
             C 270 260 260 285 256 320 Z" 
          fill="url(#goldGrad)" />

    <!-- Center Trunk Branching Upwards -->
    <path d="M 253 285 C 253 250 250 225 242 205 C 238 195 230 185 220 176 C 216 172 220 166 225 168 C 236 174 246 186 252 200 C 255 190 260 178 266 168 C 270 161 276 166 272 172 C 265 182 259 194 257 205 C 262 225 259 250 259 285 Z" fill="url(#goldGrad)" />

    <!-- Majestic Ancestral Root Base -->
    <path d="M 254 315 
             C 250 335 235 348 205 358 C 196 361 200 366 208 365 C 236 361 250 350 255 332
             C 257 332 257 332 257 332
             C 262 350 276 361 304 365 C 312 366 316 361 307 358 C 277 348 262 335 258 315 Z" 
          fill="url(#goldGrad)" opacity="0.9" />

    <!-- Golden Canopy / Leaf Clusters (Nodes of Lineage) -->
    <!-- Top Central Clustered Leaves -->
    <circle cx="256" cy="140" r="28" fill="url(#treeGrad)" />
    <circle cx="225" cy="162" r="22" fill="url(#treeGrad)" />
    <circle cx="287" cy="162" r="22" fill="url(#treeGrad)" />
    <circle cx="256" cy="180" r="18" fill="url(#goldGrad)" />

    <!-- Left Canopy Nodes -->
    <circle cx="175" cy="188" r="24" fill="url(#treeGrad)" />
    <circle cx="145" cy="216" r="20" fill="url(#goldGrad)" />
    <circle cx="188" cy="225" r="16" fill="url(#treeGrad)" />
    <circle cx="132" cy="245" r="14" fill="url(#goldGrad)" />

    <!-- Right Canopy Nodes -->
    <circle cx="337" cy="188" r="24" fill="url(#treeGrad)" />
    <circle cx="367" cy="216" r="20" fill="url(#goldGrad)" />
    <circle cx="324" cy="225" r="16" fill="url(#treeGrad)" />
    <circle cx="380" cy="245" r="14" fill="url(#goldGrad)" />

    <!-- Radiant Nodes / Family Generation Dots -->
    <circle cx="256" cy="96" r="6" fill="#fef08a" />
    <circle cx="205" cy="118" r="5" fill="#fef08a" />
    <circle cx="307" cy="118" r="5" fill="#fef08a" />
    <circle cx="152" cy="155" r="5" fill="#fef08a" />
    <circle cx="360" cy="155" r="5" fill="#fef08a" />
    <circle cx="112" cy="210" r="4.5" fill="#fef08a" />
    <circle cx="400" cy="210" r="4.5" fill="#fef08a" />
  </g>

  <!-- Lower Banner Ribbon with Bengali & English Typography -->
  <g filter="url(#dropShadow)">
    <!-- Heritage Ribbon Base -->
    <rect x="76" y="385" width="360" height="62" rx="18" fill="#431407" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- Accent Dots on Ribbon -->
    <circle cx="102" cy="416" r="4.5" fill="url(#goldGrad)" />
    <circle cx="410" cy="416" r="4.5" fill="url(#goldGrad)" />

    <!-- Title Bengali Text -->
    <text x="256" y="416" 
          font-family="Georgia, Cambria, 'Times New Roman', serif" 
          font-size="24" 
          font-weight="bold" 
          fill="#fef08a" 
          text-anchor="middle"
          letter-spacing="1">বাড়ৈ বংশের ইতিবৃত্ত</text>

    <!-- Subtitle / English Branding -->
    <text x="256" y="435" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="11" 
          font-weight="800" 
          fill="#eab308" 
          text-anchor="middle"
          letter-spacing="3.5">PROJENITOR</text>
  </g>
</svg>
